<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4ff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f0eeff;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5135ff"/>
      <stop offset="100%" style="stop-color:#3a1fd6"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00bcd4"/>
      <stop offset="100%" style="stop-color:#0097a7"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5135ff" flood-opacity="0.18"/>
    </filter>
    <filter id="cloudShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5135ff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)" rx="16"/>

  <!-- Sky/atmosphere effect -->
  <ellipse cx="400" cy="160" rx="380" ry="120" fill="#5135ff" opacity="0.04"/>

  <!-- Background dots -->
  <g opacity="0.1">
    <circle cx="50" cy="60" r="2" fill="#5135ff"/>
    <circle cx="90" cy="60" r="2" fill="#5135ff"/>
    <circle cx="130" cy="60" r="2" fill="#5135ff"/>
    <circle cx="50" cy="100" r="2" fill="#5135ff"/>
    <circle cx="90" cy="100" r="2" fill="#5135ff"/>
    <circle cx="680" cy="420" r="2" fill="#00bcd4"/>
    <circle cx="720" cy="420" r="2" fill="#00bcd4"/>
    <circle cx="760" cy="420" r="2" fill="#00bcd4"/>
    <circle cx="720" cy="460" r="2" fill="#00bcd4"/>
    <circle cx="760" cy="460" r="2" fill="#00bcd4"/>
  </g>

  <!-- ===== MAIN CLOUD (center) ===== -->
  <g filter="url(#cloudShadow)">
    <circle cx="340" cy="165" r="72" fill="url(#cloudGrad)"/>
    <circle cx="400" cy="145" r="60" fill="url(#cloudGrad)"/>
    <circle cx="460" cy="165" r="72" fill="url(#cloudGrad)"/>
    <rect x="268" y="165" width="264" height="80" rx="0" fill="url(#cloudGrad)"/>
    <!-- Cloud bottom smooth -->
    <rect x="268" y="210" width="264" height="35" rx="17" fill="url(#cloudGrad)"/>
    <!-- Cloud highlight -->
    <circle cx="350" cy="145" r="28" fill="#7c68ff" opacity="0.4"/>
    <!-- Cloud icon inner -->
    <text x="400" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="white">CLOUD PLATFORM</text>
    <!-- Inner icons -->
    <rect x="330" y="168" width="32" height="22" rx="4" fill="rgba(255,255,255,0.25)"/>
    <text x="346" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white">IaaS</text>
    <rect x="370" y="168" width="32" height="22" rx="4" fill="rgba(255,255,255,0.25)"/>
    <text x="386" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white">PaaS</text>
    <rect x="410" y="168" width="32" height="22" rx="4" fill="rgba(255,255,255,0.25)"/>
    <text x="426" y="183" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="white">SaaS</text>
  </g>

  <!-- Connection lines from cloud to nodes -->
  <!-- Cloud center bottom point: ~400, 245 -->
  <line x1="400" y1="248" x2="150" y2="340" stroke="#5135ff" stroke-width="2" stroke-dasharray="7,4" opacity="0.6"/>
  <line x1="400" y1="248" x2="300" y2="360" stroke="#5135ff" stroke-width="2" stroke-dasharray="7,4" opacity="0.6"/>
  <line x1="400" y1="248" x2="400" y2="370" stroke="#5135ff" stroke-width="2" stroke-dasharray="7,4" opacity="0.6"/>
  <line x1="400" y1="248" x2="500" y2="360" stroke="#5135ff" stroke-width="2" stroke-dasharray="7,4" opacity="0.6"/>
  <line x1="400" y1="248" x2="650" y2="340" stroke="#5135ff" stroke-width="2" stroke-dasharray="7,4" opacity="0.6"/>

  <!-- Data flow dots on lines -->
  <circle cx="268" cy="295" r="5" fill="#5135ff" opacity="0.8"/>
  <circle cx="345" cy="307" r="5" fill="#7c68ff" opacity="0.8"/>
  <circle cx="400" cy="309" r="5" fill="#5135ff" opacity="0.8"/>
  <circle cx="455" cy="307" r="5" fill="#7c68ff" opacity="0.8"/>
  <circle cx="528" cy="293" r="5" fill="#5135ff" opacity="0.8"/>

  <!-- ===== SERVER NODES ===== -->
  <!-- Node 1: AWS -->
  <g filter="url(#softShadow)">
    <rect x="90" y="335" width="120" height="80" rx="12" fill="url(#serverGrad)"/>
    <!-- Server rack lines -->
    <rect x="100" y="348" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="116" cy="355" r="3" fill="#00c853"/>
    <rect x="122" y="351" width="55" height="6" rx="3" fill="#333"/>
    <rect x="100" y="366" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="116" cy="373" r="3" fill="#00bcd4"/>
    <rect x="122" y="369" width="42" height="6" rx="3" fill="#333"/>
    <rect x="100" y="384" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="116" cy="391" r="3" fill="#ffd700"/>
    <rect x="122" y="387" width="60" height="6" rx="3" fill="#333"/>
    <text x="150" y="426" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#5135ff">AWS</text>
  </g>

  <!-- Node 2: Azure -->
  <g filter="url(#softShadow)">
    <rect x="240" y="355" width="120" height="80" rx="12" fill="url(#serverGrad)"/>
    <rect x="250" y="368" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="266" cy="375" r="3" fill="#00c853"/>
    <rect x="272" y="371" width="50" height="6" rx="3" fill="#333"/>
    <rect x="250" y="386" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="266" cy="393" r="3" fill="#00bcd4"/>
    <rect x="272" y="389" width="38" height="6" rx="3" fill="#333"/>
    <rect x="250" y="404" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="266" cy="411" r="3" fill="#ffd700"/>
    <text x="300" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#00bcd4">Azure</text>
  </g>

  <!-- Node 3: GCP -->
  <g filter="url(#softShadow)">
    <rect x="340" y="365" width="120" height="80" rx="12" fill="url(#serverGrad)"/>
    <rect x="350" y="378" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="366" cy="385" r="3" fill="#00c853"/>
    <rect x="372" y="381" width="56" height="6" rx="3" fill="#333"/>
    <rect x="350" y="396" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="366" cy="403" r="3" fill="#FF5455"/>
    <rect x="372" y="399" width="44" height="6" rx="3" fill="#333"/>
    <rect x="350" y="414" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="366" cy="421" r="3" fill="#ffd700"/>
    <text x="400" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#4285F4">GCP</text>
  </g>

  <!-- Node 4: Private Cloud -->
  <g filter="url(#softShadow)">
    <rect x="440" y="355" width="120" height="80" rx="12" fill="url(#serverGrad)"/>
    <rect x="450" y="368" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="466" cy="375" r="3" fill="#00c853"/>
    <rect x="472" y="371" width="48" height="6" rx="3" fill="#333"/>
    <rect x="450" y="386" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="466" cy="393" r="3" fill="#00bcd4"/>
    <rect x="472" y="389" width="62" height="6" rx="3" fill="#333"/>
    <rect x="450" y="404" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="466" cy="411" r="3" fill="#a78bff"/>
    <text x="500" y="444" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#7c68ff">Private</text>
  </g>

  <!-- Node 5: DigitalOcean -->
  <g filter="url(#softShadow)">
    <rect x="590" y="335" width="120" height="80" rx="12" fill="url(#serverGrad)"/>
    <rect x="600" y="348" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="616" cy="355" r="3" fill="#00c853"/>
    <rect x="622" y="351" width="52" height="6" rx="3" fill="#333"/>
    <rect x="600" y="366" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="616" cy="373" r="3" fill="#0080ff"/>
    <rect x="622" y="369" width="40" height="6" rx="3" fill="#333"/>
    <rect x="600" y="384" width="100" height="14" rx="3" fill="#1e3a5f"/>
    <circle cx="616" cy="391" r="3" fill="#ffd700"/>
    <text x="650" y="426" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#0080ff">DigitalOcean</text>
  </g>

  <!-- ===== HIPAA BADGE (top left) ===== -->
  <g filter="url(#softShadow)">
    <rect x="40" y="60" width="130" height="130" rx="16" fill="white"/>
    <!-- Shield -->
    <path d="M105,82 L130,93 L130,122 Q130,148 105,158 Q80,148 80,122 L80,93 Z" fill="#5135ff" opacity="0.9"/>
    <path d="M105,90 L122,99 L122,122 Q122,142 105,150 Q88,142 88,122 L88,99 Z" fill="#7c68ff" opacity="0.5"/>
    <!-- H+ healthcare cross -->
    <rect x="98" y="112" width="14" height="22" rx="2" fill="white"/>
    <rect x="91" y="119" width="28" height="8" rx="2" fill="white"/>
    <text x="105" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#5135ff">HIPAA</text>
    <text x="105" y="186" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#888">Compliant Hosting</text>
  </g>

  <!-- ===== SECURITY CARD (top right) ===== -->
  <g filter="url(#softShadow)">
    <rect x="630" y="60" width="130" height="130" rx="16" fill="white"/>
    <!-- Encryption icon -->
    <rect x="660" y="80" width="70" height="50" rx="8" fill="#f0eeff"/>
    <!-- SVG lock icon (replaces emoji) -->
    <path d="M686,100 L686,92 Q686,83 695,83 Q704,83 704,92 L704,100" fill="none" stroke="#5135ff" stroke-width="3.5" stroke-linecap="round"/>
    <rect x="681" y="98" width="28" height="22" rx="4" fill="#5135ff"/>
    <circle cx="695" cy="107" r="4" fill="white"/>
    <rect x="693" y="110" width="4" height="6" rx="1" fill="white"/>
    <text x="695" y="124" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#5135ff">256-bit SSL</text>
    <line x1="650" y1="142" x2="750" y2="142" stroke="#eee" stroke-width="1"/>
    <text x="695" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#1a1a2e">Zero-Trust</text>
    <text x="695" y="172" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#888">Architecture</text>
    <text x="695" y="184" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#00bcd4">99.9% Uptime SLA</text>
  </g>

  <!-- Migration arrow indicator -->
  <g filter="url(#softShadow)">
    <rect x="210" y="82" width="180" height="52" rx="10" fill="white"/>
    <text x="225" y="102" font-family="Arial,sans-serif" font-size="10" font-weight="600" fill="#888">On-Premise</text>
    <text x="300" y="104" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#5135ff">→</text>
    <text x="316" y="102" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#5135ff">Cloud</text>
    <text x="300" y="122" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#aaa">Seamless Migration</text>
  </g>

  <!-- Bottom label -->
  <rect x="60" y="463" width="680" height="28" rx="8" fill="white" opacity="0.55"/>
  <text x="400" y="481" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#3a1fd6">Cloud Services · Secure Architecture · HIPAA Hosting · Migration · IaaS · PaaS · SaaS</text>
</svg>
