; Merge into the production php.ini or PHP-FPM pool configuration, then restart PHP.
; These system settings cannot be enabled reliably from .user.ini.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=10000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
display_errors=Off
log_errors=On
